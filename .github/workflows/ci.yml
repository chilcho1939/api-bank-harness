name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: Sonar lo usa para atribuir issues nuevos (blame).
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unitarios + integración (Testcontainers usa el Docker del runner) + ArchUnit + JaCoCo.
      - name: Verify
        run: ./mvnw -B verify

      - name: Análisis en SonarCloud
        # Condicional: en PRs desde forks no hay secretos y el step fallaría.
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
