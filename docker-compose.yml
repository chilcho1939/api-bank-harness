services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: transactions
      POSTGRES_PASSWORD: transactions
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transactions -d transactions"]
      interval: 5s
      timeout: 3s
      retries: 10

  provider-mock:
    image: wiremock/wiremock:3.13.0
    command: ["--disable-banner"]
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock
