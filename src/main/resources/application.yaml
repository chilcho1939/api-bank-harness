spring:
  application.name: transactions
  threads.virtual.enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transactions}
    username: ${DB_USER:transactions}
    password: ${DB_PASSWORD:transactions}
    # Con virtual threads, el pool es la contrapresión real hacia la BD.
    hikari.maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    # Flyway es dueño del esquema; Hibernate solo valida.
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
management.endpoints.web.exposure.include: health,info
provider:
  base-url: ${PROVIDER_BASE_URL:http://localhost:8089}
  connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:1s}
  # Excedido → resultado UNKNOWN; nunca se reintenta (la operación pudo aplicarse).
  read-timeout: ${PROVIDER_READ_TIMEOUT:3s}
  retry:
    # Incluye el primer intento. Solo se reintenta cuando la petición no llegó (error de conexión).
    max-attempts: ${PROVIDER_RETRY_MAX_ATTEMPTS:3}
    # Backoff exponencial con jitter: 200ms, ~400ms… (±50 %).
    wait-duration: ${PROVIDER_RETRY_WAIT:200ms}
    backoff-multiplier: ${PROVIDER_RETRY_BACKOFF_MULTIPLIER:2}
    randomization-factor: ${PROVIDER_RETRY_RANDOMIZATION:0.5}
  circuit-breaker:
    failure-rate-threshold: ${PROVIDER_CB_FAILURE_RATE:50}
    sliding-window-size: ${PROVIDER_CB_WINDOW:20}
    minimum-number-of-calls: ${PROVIDER_CB_MIN_CALLS:10}
    wait-duration-in-open-state: ${PROVIDER_CB_OPEN_WAIT:30s}
